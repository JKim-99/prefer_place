<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="취향지도 계정과 저장 장소 관리">
  <meta name="theme-color" content="#f4f0e7">
  <title>마이페이지 — 취향지도</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=43">
  <script src="assets/js/auth.js?v=10" defer></script>
  <script src="assets/js/mypage.js?v=19" defer></script>
</head>
<body class="mypage-route">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a class="profile-brand" href="/" aria-label="취향지도 메인으로"><span class="profile-brand-mark" aria-hidden="true">⌖</span><span>취향지도<small>PLACE ARCHIVE</small></span></a>
    <div class="auth-header"><a id="auth-user" class="auth-header-button" href="/mypage.html" hidden></a><button id="auth-open" class="auth-header-button" type="button">로그인</button><button id="auth-logout" class="auth-header-button" type="button" hidden>로그아웃</button></div>
  </header>
  <main id="main">
    <section class="profile-page" id="profile-page" hidden aria-labelledby="mypage-title">
      <header class="profile-page-header"><div><h1 id="mypage-title">마이페이지</h1><p>내 정보와 저장한 장소를 관리합니다.</p></div><a class="profile-page-back" href="/">지도 돌아가기</a></header>
      <div id="mypage-dialog" class="mypage-dialog">
        <nav class="mypage-tabs" aria-label="마이페이지 메뉴"><button type="button" data-tab="profile" aria-pressed="true">내 정보</button><button type="button" data-tab="places" aria-pressed="false">내 장소</button><button type="button" data-tab="password" aria-pressed="false">비밀번호 변경</button></nav>
        <section id="mypage-profile"><form id="profile-form"><div class="avatar-editor"><img id="profile-avatar-preview" alt="대표 이미지" hidden><span id="avatar-placeholder" aria-hidden="true">✳</span><div><label class="avatar-upload">대표 이미지 선택<input id="profile-avatar" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="avatar-remove" type="button">이미지 삭제</button></div></div><label>아이디<input id="profile-username" required minlength="4" maxlength="30" pattern="[A-Za-z0-9_]{4,30}"></label><small id="profile-username-hint"></small><label>닉네임<input id="profile-nickname" required minlength="2" maxlength="30"></label><label>이메일<input id="profile-email" type="email" readonly></label><label>성별 (선택)<select id="profile-gender"><option value="">선택하지 않음</option><option value="female">여성</option><option value="male">남성</option><option value="other">기타</option><option value="undisclosed">응답하지 않음</option></select></label><p class="mypage-status" id="profile-status" role="status"></p><button type="submit" class="auth-submit">저장하기</button></form></section>
        <section id="mypage-places" hidden><div class="category-tabs" role="group" aria-label="장소 카테고리"><button type="button" data-category="all" aria-pressed="true">전체</button><button type="button" data-category="restaurant" aria-pressed="false">음식점</button><button type="button" data-category="cafe" aria-pressed="false">카페·디저트</button><button type="button" data-category="stay" aria-pressed="false">숙박</button><button type="button" data-category="shopping" aria-pressed="false">쇼핑</button><button type="button" data-category="beauty" aria-pressed="false">미용</button><button type="button" data-category="medical" aria-pressed="false">의료</button><button type="button" data-category="culture" aria-pressed="false">문화</button><button type="button" data-category="education" aria-pressed="false">교육</button><button type="button" data-category="other" aria-pressed="false">기타</button></div><p class="mypage-note">공개한 장소의 이름과 위치는 익명 탐색에 표시될 수 있으며, 3명 이상이 공개 저장하면 인기 장소에 포함됩니다. 메모·방문 기록·태그는 나에게만 보입니다. 공공 상가정보를 기반으로 표시하며 이전 카카오 기록은 카카오맵 링크에서 확인할 수 있습니다.</p><div class="place-record-filters"><label>내 장소 검색<input id="place-record-search" type="search" placeholder="장소명, 지역, 메모, 태그 검색" autocomplete="off"></label><label>방문 상태<select id="place-visit-filter"><option value="all">모든 상태</option><option value="want">가보고 싶은 곳</option><option value="visited">방문한 곳</option><option value="again">다시 가고 싶은 곳</option><option value="">선택하지 않음</option></select></label></div><div class="place-export"><button id="export-places" type="button" disabled>전체 기록 JSON 내려받기</button><p>저장된 메모, 방문 기록과 태그도 파일에 포함됩니다.</p></div><p id="mypage-places-status" role="status"></p><ul id="mypage-place-list" class="mypage-place-list"></ul></section>
        <section id="mypage-password" hidden><form id="password-form"><label>현재 비밀번호<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>새 비밀번호<input name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>새 비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p id="password-status" role="status"></p><button class="auth-submit" type="submit">비밀번호 변경</button></form></section>
      </div>
    </section>
  </main>
  <dialog id="auth-dialog" aria-labelledby="auth-title"><div class="auth-dialog-head"><h2 id="auth-title">로그인</h2><button id="auth-close" type="button" class="close-button" aria-label="닫기">×</button></div><form id="auth-form">
    <label>아이디<input id="auth-username" name="username" autocomplete="username" required maxlength="254"></label>
    <label id="nickname-field" hidden>닉네임<input id="auth-nickname" name="nickname" autocomplete="nickname" minlength="2" maxlength="30"></label>
    <label id="email-field" hidden>이메일<input id="auth-email" name="email" type="email" autocomplete="email" maxlength="254"></label>
    <label>비밀번호<input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label>
    <label id="confirm-field" hidden>비밀번호 확인<input id="auth-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label>
    <label id="gender-field" hidden>성별 (선택)<select name="gender"><option value="">선택하지 않음</option><option value="female">여성</option><option value="male">남성</option><option value="other">기타</option><option value="undisclosed">응답하지 않음</option></select></label>
    <label id="remember-field" class="remember-label"><input id="remember-id" type="checkbox"> 아이디 저장</label>
    <p class="auth-error" id="auth-error" role="alert"></p><button type="submit" class="auth-submit">로그인</button></form><p class="auth-switch-text"><span id="auth-switch-label">아직 계정이 없나요?</span> <button type="button" id="auth-switch">회원가입</button></p></dialog>
</body>
</html>
